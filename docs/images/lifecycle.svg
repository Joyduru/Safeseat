<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A show from start to finish</title>
  <desc id="d">Timeline: tickets are on sale from creation until doors open. Then a safety window runs, during which the organizer can still cancel and refund everyone. After the window ends anyone can trigger the payout, which only goes to the organizer.</desc>

  <rect x="1" y="1" width="958" height="338" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <text x="40" y="52" font-size="24" font-weight="700" fill="#111827">A show from start to finish</text>
  <text x="40" y="80" font-size="15" fill="#4b5563">What can happen at each stage.</text>

  <!-- Phase bars -->
  <rect x="100" y="160" width="230" height="10" fill="#8b5cf6"/>
  <rect x="330" y="160" width="270" height="10" fill="#f59e0b"/>
  <rect x="600" y="160" width="260" height="10" fill="#10b981"/>

  <g text-anchor="middle" font-size="16" font-weight="700">
    <text x="215" y="140" fill="#5b21b6">Tickets on sale</text>
    <text x="465" y="140" fill="#92400e">Safety window</text>
    <text x="730" y="140" fill="#065f46">Payout unlocked</text>
  </g>

  <!-- Milestones -->
  <g fill="#ffffff" stroke="#374151" stroke-width="3">
    <circle cx="100" cy="165" r="9"/>
    <circle cx="330" cy="165" r="9"/>
    <circle cx="600" cy="165" r="9"/>
    <circle cx="860" cy="165" r="9"/>
  </g>
  <g text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#111827">
      <text x="100" y="200">Show created</text>
      <text x="330" y="200">Doors open</text>
      <text x="600" y="200">Window ends</text>
      <text x="860" y="200">Organizer paid</text>
    </g>
    <g font-size="12" fill="#6b7280" font-family="ui-monospace, Consolas, monospace">
      <text x="100" y="218">create_event</text>
      <text x="330" y="218">starts_at</text>
      <text x="600" y="218">+ payout delay</text>
      <text x="860" y="218">claim_payout</text>
    </g>
    <g font-size="14" fill="#374151">
      <text x="215" y="262">Buy, gift, or resell</text>
      <text x="215" y="282">at or below the price cap.</text>
      <text x="465" y="262">Sales and resales are closed.</text>
      <text x="465" y="282">Cancelling still refunds everyone.</text>
      <text x="730" y="262">Anyone can trigger the payout.</text>
      <text x="730" y="282">It can only go to the organizer.</text>
    </g>
  </g>

  <text x="480" y="320" text-anchor="middle" font-size="13" fill="#6b7280">Until the payout is claimed, the organizer can cancel and every current ticket holder is refunded.</text>
</svg>
