<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How SafeSeat works</title>
  <desc id="d">A fan pays 1 NEAR, which stays locked inside the ticket NFT. If the show happens the organizer collects after the safety window. If it is cancelled the current holder is refunded instantly. If the ticket is resold, the price is capped and the refund moves with the ticket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="598" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#111827">SafeSeat: the money waits inside the ticket</text>
  <text x="40" y="86" font-size="16" fill="#4b5563">The payment is locked in the ticket NFT until the show's outcome is known.</text>

  <!-- Fan -->
  <rect x="40" y="115" width="160" height="110" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="120" cy="143" r="13" fill="#6b7280"/>
  <path d="M98,181 a22,22 0 0 1 44,0 z" fill="#6b7280"/>
  <text x="120" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Fan</text>

  <line x1="208" y1="170" x2="318" y2="170" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="263" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">pays 1 NEAR</text>

  <!-- Ticket -->
  <rect x="330" y="105" width="300" height="130" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="330" cy="170" r="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="630" cy="170" r="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="316" y="156" width="13" height="28" fill="#ffffff"/>
  <rect x="631" y="156" width="13" height="28" fill="#ffffff"/>
  <line x1="560" y1="117" x2="560" y2="223" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="445" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#78350f">Ticket NFT</text>
  <rect x="360" y="170" width="170" height="32" rx="16" fill="#fde68a"/>
  <text x="445" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">1 NEAR locked inside</text>
  <text x="598" y="170" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#b45309" transform="rotate(-90 598 170)">ADMIT ONE</text>

  <g font-size="14" fill="#4b5563">
    <text x="662" y="150">Held by the smart contract.</text>
    <text x="662" y="172">No one, not even the organizer,</text>
    <text x="662" y="194">can move it outside the rules.</text>
  </g>

  <!-- Branches -->
  <g stroke="#6b7280" stroke-width="3" fill="none">
    <path d="M480,235 V275"/>
    <path d="M180,275 H780"/>
    <path d="M180,275 V320" marker-end="url(#arrow)"/>
    <path d="M480,275 V320" marker-end="url(#arrow)"/>
    <path d="M780,275 V320" marker-end="url(#arrow)"/>
  </g>

  <!-- Outcomes -->
  <g font-size="14.5" text-anchor="middle">
    <rect x="40" y="330" width="280" height="210" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="180" y="370" font-size="18" font-weight="700" fill="#065f46">The show happens</text>
    <text x="180" y="402" fill="#064e3b">After the safety window</text>
    <text x="180" y="424" fill="#064e3b">(e.g. 24h after doors open),</text>
    <text x="180" y="446" fill="#064e3b">the organizer collects.</text>
    <rect x="60" y="478" width="240" height="36" rx="18" fill="#a7f3d0"/>
    <text x="180" y="501" font-size="14" font-weight="700" fill="#065f46">1 NEAR → organizer</text>

    <rect x="340" y="330" width="280" height="210" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="480" y="370" font-size="18" font-weight="700" fill="#1e40af">The show is cancelled</text>
    <text x="480" y="402" fill="#1e3a8a">Whoever holds the ticket</text>
    <text x="480" y="424" fill="#1e3a8a">is refunded in the same</text>
    <text x="480" y="446" fill="#1e3a8a">transaction. No forms.</text>
    <rect x="360" y="478" width="240" height="36" rx="18" fill="#bfdbfe"/>
    <text x="480" y="501" font-size="14" font-weight="700" fill="#1e40af">1 NEAR → ticket holder</text>

    <rect x="640" y="330" width="280" height="210" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="780" y="370" font-size="18" font-weight="700" fill="#5b21b6">The ticket is resold</text>
    <text x="780" y="402" fill="#4c1d95">The resale price is capped.</text>
    <text x="780" y="424" fill="#4c1d95">The seller is paid and the</text>
    <text x="780" y="446" fill="#4c1d95">organizer earns a royalty.</text>
    <rect x="660" y="478" width="240" height="36" rx="18" fill="#ddd6fe"/>
    <text x="780" y="501" font-size="14" font-weight="700" fill="#5b21b6">Refund moves with the ticket</text>
  </g>

  <text x="480" y="574" text-anchor="middle" font-size="16" font-style="italic" fill="#374151">The organizer is paid for delivering the show, not for selling tickets.</text>
</svg>
