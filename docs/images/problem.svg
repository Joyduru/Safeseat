<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The problem with tickets today</title>
  <desc id="d">A fan pays an organizer and the money leaves immediately. If the show is cancelled the fan chases a refund, scalpers resell at five times the price, and if the organizer vanishes the money is gone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="448" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#111827">Today: the fan carries all the risk</text>
  <text x="40" y="86" font-size="16" fill="#4b5563">Ticket money goes straight to the organizer the moment you buy.</text>

  <!-- Fan -->
  <rect x="60" y="120" width="200" height="110" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="160" cy="148" r="13" fill="#6b7280"/>
  <path d="M138,186 a22,22 0 0 1 44,0 z" fill="#6b7280"/>
  <text x="160" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Fan</text>

  <!-- Payment arrow -->
  <line x1="272" y1="175" x2="688" y2="175" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">pays 1 NEAR at checkout</text>
  <text x="480" y="200" text-anchor="middle" font-size="14" fill="#6b7280">the money leaves the fan's hands immediately</text>

  <!-- Organizer -->
  <rect x="700" y="120" width="200" height="110" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="774,150 800,132 826,150" fill="#6b7280"/>
  <rect x="780" y="150" width="40" height="34" fill="#6b7280"/>
  <rect x="794" y="166" width="12" height="18" fill="#f9fafb"/>
  <text x="800" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Organizer</text>

  <!-- Pain points -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="270" width="280" height="150" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="180" y="312" font-size="18" font-weight="700" fill="#991b1b">Show cancelled</text>
    <text x="180" y="346" fill="#7f1d1d">You chase a refund</text>
    <text x="180" y="370" fill="#7f1d1d">for weeks.</text>

    <rect x="340" y="270" width="280" height="150" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="480" y="312" font-size="18" font-weight="700" fill="#991b1b">Show sells out</text>
    <text x="480" y="346" fill="#7f1d1d">Scalpers resell</text>
    <text x="480" y="370" fill="#7f1d1d">at 5× the price.</text>

    <rect x="640" y="270" width="280" height="150" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="780" y="312" font-size="18" font-weight="700" fill="#991b1b">Organizer vanishes</text>
    <text x="780" y="346" fill="#7f1d1d">The money is</text>
    <text x="780" y="370" fill="#7f1d1d">already gone.</text>
  </g>
</svg>
